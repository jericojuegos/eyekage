name: EyeKage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build, Test & Privacy Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Kotlin & Check Types
        run: ./gradlew compileDebugKotlin

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Architecture Lint & Detekt
        run: ./gradlew detekt

      - name: Privacy & Manifest Allowlist Guard
        run: ./gradlew checkMergedManifestPermissions
